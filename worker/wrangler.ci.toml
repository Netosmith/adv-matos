name = "adv-matos-api-ci"
main = "src/worker.ts"
compatibility_date = "2026-09-15"

[vars]
ALLOWED_ORIGIN = "https://netosmith.github.io"

[[d1_databases]]
binding = "DB"
database_name = "adv-matos-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "adv-matos-files"
