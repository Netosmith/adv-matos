name: Deploy API Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$D1_DATABASE_ID" || { echo "Missing D1_DATABASE_ID"; exit 1; }

      - name: Create production Wrangler config
        shell: bash
        run: |
          cat > worker/wrangler.toml <<EOF
          name = "adv-matos-api"
          main = "src/worker.ts"
          compatibility_date = "2026-09-15"

          [vars]
          ALLOWED_ORIGIN = "https://netosmith.github.io"

          [[d1_databases]]
          binding = "DB"
          database_name = "adv-matos-db"
          database_id = "$D1_DATABASE_ID"
          migrations_dir = "migrations"

          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "adv-matos-files"
          EOF

      - name: Ensure R2 bucket exists
        run: pnpm exec wrangler r2 bucket create adv-matos-files --config worker/wrangler.toml || true

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply adv-matos-db --remote --config worker/wrangler.toml

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config worker/wrangler.toml
